<?xml version="1.0" encoding="UTF-8"?>
<!--
	BootManager application icon - original artwork created for this project.

	The glyph is the internationally standardised "power / standby" sign (IEC 60417-5010, a broken
	ring with a vertical stroke). That sign is a public standard symbol used alike by Windows, macOS
	and Linux desktops; it is not anybody's logo, so drawing it here infringes no copyright. The
	upward arrow head on the stroke is what makes the icon specific to this application: it turns
	"power" into "boot up", which is what BootManager controls.

	No third-party artwork, font or icon set was copied. Assets/bootmanager.ico and
	Assets/bootmanager-256.png are generated from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
	 role="img" aria-label="BootManager">
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2E7DF7" />
			<stop offset="1" stop-color="#0B2E6F" />
		</linearGradient>
	</defs>

	<rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#background)" />

	<g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
		<!-- Ring around centre (128,140), radius 74, with an 80 degree gap at the top. -->
		<path d="M 175.6 83.3 A 74 74 0 1 1 80.4 83.3" />
		<!-- Vertical stroke through the gap, ending in an arrow head that points up. -->
		<path d="M 128 150 L 128 50" />
		<path d="M 100 78 L 128 50 L 156 78" />
	</g>
</svg>
