name: Feature request
description: Suggest something BootManager should be able to do.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could BootManager help?
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms would need it?
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
