# Static security analysis of the C# sources. CodeQL is free for public repositories and
# reports its findings under Security > Code scanning alerts, and directly on pull requests.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published query rules are applied to code that has not changed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required to upload the findings to the code scanning dashboard.
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # The runner image does not ship the .NET 10 SDK, so autobuild cannot be trusted
          # to pick the right toolchain; the build below is run explicitly instead.
          build-mode: manual

      - name: Build
        run: dotnet build BootManager.csproj --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
